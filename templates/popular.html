{% extends "base.html" %}
{% block title %}Popular anime{% endblock %}
{% block page %}popular{% endblock %}

{% block content %}
<section class="page-head">
  <div>
    <h1>Popular anime</h1>
    <p class="sub" id="count">Ordered by popularity rank. Select a title to see what's similar.</p>
  </div>
  <label class="search">
    <span class="sr">Search titles</span>
    <input type="search" id="search" placeholder="Search by title" autocomplete="off">
  </label>
</section>

<div class="grid" id="grid" aria-live="polite"></div>
<p class="empty" id="empty" hidden>No anime match that search.</p>
<div class="more"><button type="button" id="more" class="btn" hidden>Show more</button></div>
{% endblock %}
